services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sol_a
      POSTGRES_PASSWORD: sol_a_dev
      POSTGRES_DB: sol_a
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sol_a -d sol_a"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  pgdata:
